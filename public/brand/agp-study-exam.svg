<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">Same bank. Different pressure.</title>
  <desc id="d">Study mode teaches the reasoning. Exam mode tests whether it holds when feedback is withheld.</desc>
  <rect width="1200" height="480" fill="#F7F5FF"/>
  <text x="64" y="64" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#4526D6">MODES</text>
  <text x="64" y="110" font-family="Georgia, serif" font-size="36" fill="#1B1733">Same bank. Different pressure.</text>
  <g transform="translate(64,156)">
    <rect width="520" height="260" rx="24" fill="#FFFFFF" stroke="#1B173316"/>
    <rect width="8" height="260" rx="4" fill="#00756F"/>
    <text x="36" y="48" font-family="Georgia, serif" font-size="28" fill="#1B1733">Study</text>
    <text x="36" y="88" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">Immediate feedback. Self-paced.</text>
    <text x="36" y="140" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#1B1733">Read the facts. Decide. See why.</text>
    <text x="36" y="168" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#1B1733">Carry the takeaway into the next item.</text>
    <rect x="36" y="200" width="168" height="32" rx="16" fill="#E0F5F3"/>
    <text x="120" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00756F">TEACHES THE LOOP</text>
  </g>
  <g transform="translate(616,156)">
    <rect width="520" height="260" rx="24" fill="#1B1733"/>
    <rect width="8" height="260" rx="4" fill="#5B3DF5"/>
    <text x="36" y="48" font-family="Georgia, serif" font-size="28" fill="#FFFFFF">Exam</text>
    <text x="36" y="88" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D5CFF0">Timed. No feedback until submit.</text>
    <text x="36" y="140" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#FFFFFF">Same items. Clock running.</text>
    <text x="36" y="168" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#FFFFFF">Tests whether the loop holds.</text>
    <rect x="36" y="200" width="168" height="32" rx="16" fill="#2A211B"/>
    <text x="120" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFB020">TESTS THE HOLD</text>
  </g>
</svg>
