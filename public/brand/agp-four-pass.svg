<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">How to read a governance scenario</title>
  <desc id="d">Four sequential passes over the same text: Facts, Obligations, Risks, Action.</desc>
  <rect width="1200" height="560" fill="#F7F5FF"/>
  <defs>
    <radialGradient id="wash" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#5B3DF5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F7F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#wash)"/>
  <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3.2" fill="#4526D6">FOUR PASSES</text>
  <text x="64" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#1B1733">How to read a scenario</text>
  <text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#55507A">Work in this order. Naming a framework before the facts is the common failure.</text>
  <line x1="164" y1="300" x2="1036" y2="300" stroke="#D5CFF0" stroke-width="3"/>
  <g transform="translate(64,220)">
    <rect width="248" height="252" rx="24" fill="#FFFFFF" stroke="#1B173316"/>
    <circle cx="36" cy="40" r="16" fill="#1B1733"/>
    <text x="36" y="45" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">01</text>
    <text x="64" y="48" font-family="Georgia, serif" font-size="26" fill="#1B1733">Facts</text>
    <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">What is actually</text>
    <text x="24" y="116" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">described — system,</text>
    <text x="24" y="140" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">who it affects, stage.</text>
    <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">Separate this from</text>
    <text x="24" y="202" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">what you assume.</text>
  </g>
  <g transform="translate(336,220)">
    <rect width="248" height="252" rx="24" fill="#FFFFFF" stroke="#1B173316"/>
    <circle cx="36" cy="40" r="16" fill="#1B1733"/>
    <text x="36" y="45" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">02</text>
    <text x="64" y="48" font-family="Georgia, serif" font-size="26" fill="#1B1733">Obligations</text>
    <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">What is required</text>
    <text x="24" y="116" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">here, and by whom.</text>
    <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">Attach duties to</text>
    <text x="24" y="202" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">roles and context.</text>
  </g>
  <g transform="translate(608,220)">
    <rect width="248" height="252" rx="24" fill="#FFFFFF" stroke="#1B173316"/>
    <circle cx="36" cy="40" r="16" fill="#1B1733"/>
    <text x="36" y="45" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">03</text>
    <text x="64" y="48" font-family="Georgia, serif" font-size="26" fill="#1B1733">Risks</text>
    <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">What could harm</text>
    <text x="24" y="116" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">people or the</text>
    <text x="24" y="140" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#55507A">organization.</text>
    <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">Name the harm</text>
    <text x="24" y="202" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4526D6">before the control.</text>
  </g>
  <g transform="translate(880,220)">
    <rect width="256" height="252" rx="24" fill="#1B1733"/>
    <circle cx="36" cy="40" r="16" fill="#5B3DF5"/>
    <text x="36" y="45" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">04</text>
    <text x="64" y="48" font-family="Georgia, serif" font-size="26" fill="#FFFFFF">Action</text>
    <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D5CFF0">The narrowest</text>
    <text x="24" y="116" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D5CFF0">defensible next</text>
    <text x="24" y="140" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D5CFF0">step.</text>
    <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#FFB020">Do not skip 01–03</text>
    <text x="24" y="202" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#FFB020">to reach a rule.</text>
  </g>
</svg>
