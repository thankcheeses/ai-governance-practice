# Build the static export and publish it to GitHub Pages.
#
# The base path is taken from the repository name rather than written down, so
# a rename cannot silently break every asset URL. Override it by setting a
# PAGES_BASE_PATH repository variable — needed only if this ever moves to a
# user site (`<user>.github.io`), which is served from the root and wants an
# empty value.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy after changing a repository variable, which does not
  # itself trigger a build. Every NEXT_PUBLIC_* value is inlined at build time,
  # so a variable change only takes effect on the next run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress builds are allowed to finish so a
# half-published set of assets is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than `ubuntu-latest`.
    #
    # GitHub is migrating that label to Ubuntu 26 on 19 October 2026, and every
    # run on 5 October 2026 carried the migration warning. Four deploys in a row
    # then died with "The job was not acquired by Runner of type hosted even
    # after multiple attempts" alongside an internal server error — GitHub
    # failing to hand out a runner, not anything in this repository.
    #
    # Pinning does not fix that allocation failure, which is entirely GitHub's
    # side and whose remedy is a re-run. It does two other things worth having:
    # it takes these jobs off the label actively being migrated, which is the
    # one variable that changed, and it stops 19 October silently moving the
    # build to a new OS image.
    runs-on: ubuntu-24.04
    # A job that hangs should fail in bounded time rather than sit. This does
    # not cover queue time — GitHub does not let a workflow bound how long it
    # waits for a runner — so it is a guard against a stuck build, not against
    # the acquisition failure above.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep each gate separate so a failed deployment tells us exactly which
      # verification command stopped the publish.
      - name: Verify lint
        run: npm run lint

      - name: Verify types
        run: npm run typecheck

      - name: Verify tests
        run: npm test

      - name: Verify question bank
        run: npm run check:questions

      - name: Verify BoK coverage
        run: npm run check:bok

      - name: Build static export
        env:
          PAGES_BUILD: "1"
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || github.event.repository.name }}
          # Public by definition: every NEXT_PUBLIC_* value is inlined into the
          # browser bundle, so none of them can hold a secret. They are
          # repository *variables*, not secrets — masking a value that ships in
          # plain text inside the JS bundle would only make the logs misleading.
          # The app builds and runs with all four unset; it simply drops to
          # local-only progress with no account sync and no star control.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_GITHUB_OAUTH_ENDPOINT: ${{ vars.NEXT_PUBLIC_GITHUB_OAUTH_ENDPOINT }}
        run: npm run build:pages

      # Without this, Pages runs the output through Jekyll, which drops every
      # directory beginning with an underscore — taking all of _next/ with it
      # and serving an unstyled, scriptless page. public/.nojekyll is committed
      # and should already be here; this guarantees it even if the copy step
      # ever stops including dotfiles.
      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
