# Builds the Android app in the cloud.
#
# The native project (android/) is generated output and is not committed, and
# building it needs the Android SDK. GitHub's runners already have the SDK, so
# this workflow is the build machine: nobody has to install Android Studio to
# get an installable app or a Play Store upload.
#
# Every run produces a **debug APK** — installable on any Android phone for
# testing, signed with a throwaway key, never accepted by Google Play.
#
# When the four signing secrets are set (see docs/play-store-launch.md), the
# same run also produces a **signed release bundle (.aab)**: the file you
# upload in the Play Console. Without the secrets that step is skipped, not
# failed, so the workflow is useful before the upload key exists.
name: Android build

on:
  # Run it by hand from the Actions tab whenever a new build is wanted.
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 1.0.0 (defaults to package.json)"
        required: false
        type: string
  # Also on a pull request that changes how the app is packaged, so a broken
  # build is caught before it merges.
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "capacitor.config.ts"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8's Android project targets Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Static export into ./out. No Supabase variables are set, so this is the
      # offline configuration docs/android-beta.md recommends: the app makes no
      # network call at all.
      - name: Build the web bundle
        run: npm run build:mobile

      - name: Generate the Android project
        run: |
          npx cap add android
          # Launcher icons and splash from assets/, Android only, so the
          # generator leaves public/ and the web manifest alone.
          npx capacitor-assets generate --android
          npx cap sync android

      # Google Play refuses an upload whose versionCode is not higher than the
      # last one. The run number only ever goes up.
      - name: Set the version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          name="${VERSION_NAME:-$(node -p "require('./package.json').version")}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${name}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ai-governance-practice-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signing. The keystore arrives base64-encoded in a secret, is written to
      # the runner's temp directory, and is handed to Gradle through the
      # injected-signing properties, so no signing config is ever committed.
      # The secrets are read into the environment and never echoed.
      - name: Build the signed release bundle
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are not set; skipping the release bundle."
            echo "See docs/play-store-launch.md, step 3."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cd android
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$keystore"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.built == 'true'
        with:
          name: ai-governance-practice-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
